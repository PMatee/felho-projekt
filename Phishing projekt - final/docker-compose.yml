# Helyi fejlesztői környezet: Function App + Azurite (Storage emulátor) + Cosmos DB emulátor.
# Indítás:  docker compose up --build
# Felület:  http://localhost:7071/api/ui
#
# FIGYELEM: csak fejlesztéshez való. A lent szereplő kulcsok az emulátorok nyilvánosan ismert,
# alapértelmezett kulcsai, nem valódi titkok.
services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"

  cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
    environment:
      PROTOCOL: http          # ha a kapcsolat nem épül fel, ellenőrizd az emulátor aktuális dokumentációját
    ports:
      - "8081:8081"           # adatbázis
      - "1234:1234"           # Data Explorer: http://localhost:1234

  functions:
    build: .
    depends_on:
      - azurite
      - cosmos
    ports:
      - "7071:80"
    environment:
      FUNCTIONS_WORKER_RUNTIME: dotnet-isolated
      AzureWebJobsStorage: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"
      COSMOS_EMULATOR: "true"
      COSMOS_ENDPOINT: http://cosmos:8081
      COSMOS_KEY: "C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw=="
      COSMOS_DATABASE: PhishingDb
      COSMOS_CONTAINER: Analyses
